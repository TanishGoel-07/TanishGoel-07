<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="40%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="35%" stop-color="#4facfe"/>
      <stop offset="70%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#ff007a"/>
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0f7fa"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
      <circle cx="30" cy="0" r="1.2" fill="#00f2fe" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Base Card Background -->
  <rect x="5" y="5" width="890" height="270" rx="20" fill="url(#bgGradient)" />
  <rect x="5" y="5" width="890" height="270" rx="20" fill="url(#cyberGrid)" />

  <!-- Outer Neon Border Frame -->
  <rect x="5" y="5" width="890" height="270" rx="20" fill="none" stroke="url(#borderGlow)" stroke-width="2.5" filter="url(#subtleGlow)"/>

  <!-- Top Terminal Header Bar -->
  <g transform="translate(30, 24)">
    <circle cx="10" cy="10" r="6" fill="#ff5f56" />
    <circle cx="28" cy="10" r="6" fill="#ffbd2e" />
    <circle cx="46" cy="10" r="6" fill="#27c93f" />
    <text x="66" y="14" fill="#64748b" font-family="'Fira Code', monospace" font-size="12" font-weight="500">tanish@systems:~ (production-ready)</text>
    
    <!-- Status Pill Right -->
    <g transform="translate(620, -2)">
      <rect x="0" y="0" width="215" height="24" rx="12" fill="#0f291e" stroke="#22c55e" stroke-width="1"/>
      <circle cx="14" cy="12" r="4" fill="#22c55e" filter="url(#subtleGlow)"/>
      <text x="26" y="16" fill="#86efac" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">OPEN TO SWE INTERNSHIPS</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="25" y1="52" x2="875" y2="52" stroke="#1e293b" stroke-width="1.2" />

  <!-- Main Hero Title -->
  <text x="35" y="112" fill="url(#textGrad)" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#neonGlow)">
    TANISH GOEL
  </text>
  <text x="345" y="110" fill="#00f2fe" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="800">⚡</text>

  <!-- Subtitle Tagline -->
  <text x="35" y="145" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="15" font-weight="600" letter-spacing="1.5">
    FULL-STACK ARCHITECT &amp; AI SYSTEMS ENGINEER
  </text>

  <!-- Quick Proof Badges (Chips) -->
  <g transform="translate(35, 175)">
    <!-- 400+ DSA -->
    <rect x="0" y="0" width="135" height="28" rx="6" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2"/>
    <text x="12" y="18" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">🎯 400+ DSA Solved</text>

    <!-- Hackathon Finalist -->
    <rect x="145" y="0" width="180" height="28" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
    <text x="157" y="18" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">🏆 Finalist @ IIIT Una</text>

    <!-- 8.57 CGPA -->
    <rect x="335" y="0" width="150" height="28" rx="6" fill="#0f172a" stroke="#ec4899" stroke-width="1.2"/>
    <text x="347" y="18" fill="#f472b6" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">🎓 8.57 CGPA (KIET)</text>

    <!-- 2x SIH -->
    <rect x="495" y="0" width="165" height="28" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1.2"/>
    <text x="507" y="18" fill="#facc15" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">🏅 2x SIH Dept Winner</text>
  </g>

  <!-- Core Tech Badges Stack Row -->
  <g transform="translate(35, 222)">
    <rect x="0" y="0" width="830" height="34" rx="8" fill="#070b14" stroke="#1e293b" stroke-width="1"/>
    
    <text x="15" y="22" fill="#64748b" font-family="'Fira Code', monospace" font-size="12" font-weight="700">CORE ARSENAL &gt;</text>

    <!-- Stack Pills -->
    <g transform="translate(145, 6)">
      <rect x="0" y="0" width="82" height="22" rx="4" fill="#000000" stroke="#334155" stroke-width="1"/>
      <text x="12" y="15" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Next.js 14</text>

      <rect x="90" y="0" width="70" height="22" rx="4" fill="#005544" stroke="#009688" stroke-width="1"/>
      <text x="100" y="15" fill="#5eead4" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">FastAPI</text>

      <rect x="168" y="0" width="68" height="22" rx="4" fill="#3c0a1a" stroke="#e0234e" stroke-width="1"/>
      <text x="178" y="15" fill="#fca5a5" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">NestJS</text>

      <rect x="244" y="0" width="76" height="22" rx="4" fill="#132338" stroke="#3178c6" stroke-width="1"/>
      <text x="252" y="15" fill="#93c5fd" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">TypeScript</text>

      <rect x="328" y="0" width="85" height="22" rx="4" fill="#152438" stroke="#316192" stroke-width="1"/>
      <text x="336" y="15" fill="#93c5fd" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">PostgreSQL</text>

      <rect x="421" y="0" width="78" height="22" rx="4" fill="#2d133b" stroke="#8b5cf6" stroke-width="1"/>
      <text x="429" y="15" fill="#d8b4fe" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">pgvector</text>

      <rect x="507" y="0" width="65" height="22" rx="4" fill="#0b233a" stroke="#2496ed" stroke-width="1"/>
      <text x="517" y="15" fill="#7dd3fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Docker</text>

      <rect x="580" y="0" width="70" height="22" rx="4" fill="#36120b" stroke="#ee4c2c" stroke-width="1"/>
      <text x="590" y="15" fill="#fdba74" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">PyTorch</text>
    </g>
  </g>
</svg>
